name: Project Read Propose Runtime Loop

on:
  push:
    branches:
      - feat/project-read-propose-loop
    paths:
      - '.github/workflows/project-read-propose-loop.yml'
      - 'package.json'
      - 'src/domain/project/**'
      - 'src/application/**'
      - 'src/composition/**'
      - 'src/infrastructure/sqlite/**'
      - 'src/infrastructure/runtime/**'
      - 'test/**'
      - 'scripts/validate-runtime-bridge-03a.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-read-propose-runtime-loop:
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'

      - name: Run persistent project runtime loop validation
        shell: pwsh
        run: node scripts/validate-runtime-bridge-03a.mjs
