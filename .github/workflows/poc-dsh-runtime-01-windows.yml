name: POC DSH Runtime 01 Windows

on:
  push:
    branches:
      - poc/dsh-runtime-01
    paths:
      - 'poc/dsh-runtime-01/**'
      - '.github/workflows/poc-dsh-runtime-01-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-runtime-boundary:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout Personal OS POC
        uses: actions/checkout@v4
        with:
          path: personal-os

      - name: Checkout DeepSeek Harness frozen source
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: deepseek-harness

      - name: Setup Node 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'

      - name: Activate pnpm 11.7.0
        shell: pwsh
        run: |
          node --version
          corepack --version
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: Install and build frozen DSH source
        shell: pwsh
        working-directory: deepseek-harness
        run: |
          git rev-parse HEAD
          pnpm install --frozen-lockfile
          pnpm run build:lib

      - name: Runtime-neutral tests
        shell: pwsh
        working-directory: personal-os/poc/dsh-runtime-01
        run: node --test

      - name: Fake runtime smoke
        shell: pwsh
        working-directory: personal-os/poc/dsh-runtime-01
        run: node scripts/smoke-fake.mjs

      - name: DSH credential-free source boot smoke
        shell: pwsh
        working-directory: personal-os/poc/dsh-runtime-01
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}\deepseek-harness
        run: node scripts/smoke-dsh-boot.mjs

      - name: DSH two-cycle lifecycle smoke
        shell: pwsh
        working-directory: personal-os/poc/dsh-runtime-01
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}\deepseek-harness
        run: node scripts/smoke-dsh-lifecycle.mjs

      - name: DSH forced-crash isolation smoke
        shell: pwsh
        working-directory: personal-os/poc/dsh-runtime-01
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}\deepseek-harness
        run: node scripts/smoke-dsh-crash-isolation.mjs
